name: custom-ci

on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bun install --frozen-lockfile
      - name: Privacy gate
        run: scripts/custom/check-privacy.sh
      - name: Shell syntax
        run: |
          bash -n scripts/custom/launcher/omp
          for f in scripts/custom/*.sh; do bash -n "$f"; done
      - name: Shellcheck
        run: shellcheck -x scripts/custom/*.sh scripts/custom/launcher/omp
      - name: Upstream full check
        run: bun run ci:check:full
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"mode":"workspace"},{"mode":"native"},{"mode":"coding-agent-singleton"},{"mode":"coding-agent-ui"},{"mode":"coding-agent-runtime"},{"mode":"coding-agent-native","shard":"1/3"},{"mode":"coding-agent-native","shard":"2/3"},{"mode":"coding-agent-native","shard":"3/3"}]' || '[{"mode":"workspace"},{"mode":"native"},{"mode":"coding-agent-singleton"},{"mode":"coding-agent-ui"},{"mode":"coding-agent-runtime"},{"mode":"coding-agent-native","shard":"1/1"}]') }}
    env:
      OMP_TEST_CONCURRENCY: ${{ matrix.mode == 'coding-agent-ui' && '2' || matrix.mode == 'coding-agent-singleton' && '1' || '4' }}
      OMP_TEST_TIMEOUT: "120"
      OMP_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Fetch Linux x64 native addons
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/natives/package.json").version')"
          tarball="$(npm view "@oh-my-pi/pi-natives-linux-x64@$version" dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p packages/natives/native
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
      - name: Install TUI debug tool dependencies
        if: matrix.mode == 'native'
        run: bun install --cwd .omp/tools --frozen-lockfile
      - name: Run TypeScript tests
        if: matrix.mode != 'coding-agent-native'
        run: bun scripts/ci-test-ts.ts "${{ matrix.mode }}"
      - name: Run coding-agent-native tests with failed-file retries
        if: matrix.mode == 'coding-agent-native'
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/coding-agent-native-tests.log"
          bun scripts/ci-test-ts.ts "${{ matrix.mode }}" --full 2>&1 | tee "$log"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -eq 0 ]; then
            exit 0
          fi

          failed_files() {
            awk '
              /^[[:space:]]*[^[:space:]].*\.test\.[cm]?[jt]sx?:[[:space:]]*$/ {
                file = $0
                sub(/^[[:space:]]*/, "", file)
                sub(/:[[:space:]]*$/, "", file)
              }
              /^\(fail\)[[:space:]]/ && file != "" { print file }
            ' "$1" | sort -u
          }
          mapfile -t files < <(failed_files "$log")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::The native test run failed without identifying any failing test files; no retry is safe."
            exit "$test_status"
          fi

          retry_env=()
          while IFS='=' read -r key _; do
            if [[ "$key" == AWS_* || "$key" == GOOGLE_CLOUD_* ||
              "$key" == GITHUB_TOKEN || "$key" == GH_TOKEN ||
              "$key" == COPILOT_GITHUB_TOKEN || "$key" == GOOGLE_APPLICATION_CREDENTIALS ||
              "$key" == ANTHROPIC_OAUTH_TOKEN || "$key" == XAI_OAUTH_TOKEN ||
              "$key" == *_API_KEY || "$key" == *_OAUTH_TOKEN || "$key" == *BEARER_TOKEN* ]]; then
              retry_env+=(--unset "$key")
            fi
          done < <(env)
          export PI_TEST_RUNTIME=1 BUN_JSC_useConcurrentGC=0 BUN_JSC_numberOfGCMarkers=1
          unset GITHUB_ACTIONS

          for attempt in 1 2; do
            echo "Retry attempt $attempt/2 for failed test files: ${files[*]}"
            retry_log="$RUNNER_TEMP/coding-agent-native-retry-$attempt.log"
            (
              cd packages/coding-agent
              env "${retry_env[@]}" bun test --only-failures --parallel=1 --timeout=120000 "${files[@]}"
            ) 2>&1 | tee "$retry_log"
            retry_status=${PIPESTATUS[0]}
            if [ "$retry_status" -eq 0 ]; then
              echo "Coding-agent-native test files passed after retry: ${files[*]}"
              exit 0
            fi
            mapfile -t files < <(failed_files "$retry_log")
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::Retry $attempt failed without identifying any failing test files."
              exit "$retry_status"
            fi
          done
          echo "::error::Coding-agent-native tests still fail after two retries; failing test files: ${files[*]}"
          exit 1
      - name: Test release script
        if: matrix.mode == 'workspace'
        run: bun test scripts/release.test.ts

  package:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Fetch host native addon for pack-time loading
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/natives/package.json").version')"
          tarball="$(npm view "@oh-my-pi/pi-natives-linux-x64@$version" dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
      - name: Pack
        run: |
          label="$(node -p 'require("./packages/coding-agent/package.json").version')-c0"
          scripts/custom/pack.sh "$RUNNER_TEMP/pack" "$label"
          echo "LABEL=$label" >> "$GITHUB_ENV"
      - name: Smoke
        run: scripts/custom/smoke.sh "$RUNNER_TEMP/pack/omp-custom-$LABEL.tgz"
