name: custom-sync

# Note: GitHub runs scheduled workflows only from the default branch, which is `custom` on this fork.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream stable tag (vX.Y.Z). Empty = newest stable tag.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Open upstream sync PR
        run: scripts/custom/sync-upstream.sh
