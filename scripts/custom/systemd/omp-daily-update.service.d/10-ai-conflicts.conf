# Installed by install-ai-conflicts.sh --enable, removed by --disable.
#
# Weak dependency: the resolver runs first, and its result is reported on
# omp-ai-conflicts.service. Wants= (not Requires=) is why a failed or deferred resolver
# never stops the release installer, and there is still exactly one timer.
#
# Each unit keeps its own start bound: omp-daily-update.service's TimeoutStartSec counts
# from the moment the installer itself starts, not from the ordering wait above it.
[Unit]
Wants=omp-ai-conflicts.service
After=omp-ai-conflicts.service
